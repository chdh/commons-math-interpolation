<!DOCTYPE html>
<html>
<head>
 <link href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet">
 <link rel="stylesheet" href="app.css">
 <script src="app.js"></script>
 <title>LOESS - local regression demo</title>
</head>
<body>

<h1>LOESS &nbsp;&ndash;&nbsp; Local regression demo</h1>


<div class="parmHeading2">Points</div>

<div class="parmBlock">
 <div class="parmField">
  <label class="w-lbl" for="pointCount">Number of points:</label>
  <input class="w-inp" id="pointCount" type="number" min="1" value="50" required>
 </div>
 <div class="parmField">
  <label class="w-lbl" for="xMin">X minimum:</label>
  <input class="w-inp" id="xMin" type="number" value="0" step="any" required>
 </div>
 <div class="parmField">
  <label class="w-lbl" for="xMax">X maximum:</label>
  <input class="w-inp" id="xMax" type="number" value="6.283" step="any" required>
 </div>
 <div class="parmField" data-info="Standard deviation of x coordinate jitter for the points.">
  <label class="w-lbl" for="xJitter">X jitter:</label>
  <input class="w-inp" id="xJitter" type="number" min="0" value="0.05" step="any" required>
 </div>
 <div class="parmField" data-info="Standard deviation for y coordinate jitter for the points.">
  <label class="w-lbl" for="yJitter">Y jitter:</label>
  <input class="w-inp" id="yJitter" type="number" min="0" value="0.1" step="any" required>
 </div>
 <div class="parmField" data-info="Exponential boost factor for y jitter, used to generate outliers.">
  <label class="w-lbl" for="yJitterExp">Y jitter exponent:</label>
  <input class="w-inp" id="yJitterExp" type="number" value="2.5" step="any" required>
 </div>
</div>

 <div class="parmHeading2">LOESS</div>

<div class="parmBlock">
 <div class="parmField" data-info="Fraction of points to be used for computing the local regression.">
  <label class="w-lbl" for="bandwidthFraction">Bandwidth fraction:</label>
  <input class="w-inp" id="bandwidthFraction" type="number" min="0" max="1" step="any" value="0.3" required>
 </div>
 <div class="parmField" data-info="Maximum number of (additional) robustness iterations. 0 for only a single iteration.">
  <label class="w-lbl" for="robustnessIters">Rob. iterations:</label>
  <input class="w-inp" id="robustnessIters" type="number" min="0" value="2" required>
 </div>
 <div class="parmField" data-info="Acceptable accuracy. If the median residual at a certain robustness iteration is less than this amount, no more iterations are done.">
  <label class="w-lbl" for="accuracy">Accuracy:</label>
  <input class="w-inp" id="accuracy" type="number" min="0" step="any" value="1E-12" required>
 </div>
 <div class="parmField" data-info="Outlier distance relative to the median residual.">
  <label class="w-lbl" for="outlierDistanceFactor">Outlier factor:</label>
  <input class="w-inp" id="outlierDistanceFactor" type="number" min="1E-99" step="any" value="6" required>
 </div>
</div>

<div class="parmHeading2">Interpolation</div>

<div class="parmBlock">
 <div class="parmField" data-info="Minimum point distance in x-direction.">
  <label class="w-lbl" for="minXDistance">Minimum distance:</label>
  <input class="w-inp" id="minXDistance" type="number" min="1E-99" step="any" value="0.05" required>
 </div>
 <div class="parmField" data-info="Interpolation method">
  <label class="w-lbl" for="interpolationMethod">Interpolation:</label>
  <select class="w-inp" id="interpolationMethod">
   <option value="akima">Akima cubic spline</option>
   <option value="cubic">Natural cubic spline</option>
   <option value="linear">Linear</option>
   <option value="nearestNeighbor">Nearest neighbor</option>
  </select>
 </div>
</div>

<div class="actionButtons">
 <button id="updateButton">Update</button>
 <button id="updateRegressionButton" disabled>Upd. regression</button>
</div>

<div id="diagInfo"></div>

<canvas id="curveViewer" tabindex="-1"></canvas>

<div class="footer">
 Source code: <a href="https://github.com/chdh/commons-math-interpolation">github.com/chdh/commons-math-interpolation</a><br>
 Wikipedia: <a href="https://en.wikipedia.org/wiki/Local_regression">Local regression</a>
</div>

</body>
</html>
